<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dream sheep</title>

  <style>
    /* 仮ホームページ */
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url("https://raw.githubusercontent.com/P4ra-NoID/P4ra-NoID.github.io/refs/heads/main/ipicture-birthday-cake-10215274_1920.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ポップアップ表示中の暗い部分 */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    /* ポップアップ */
    #dialog {
      position: absolute;
      width: 375px;
      max-width: 90%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #dialog img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* OKボタンのクリック範囲 */
    #ok-button {
      position: absolute;

      left: 39%;
      top: 68%;

      width: 18%;
      height: 22%;

      /* 今は位置確認用 */
      opacity: 0.5;
      background: red;

      cursor: pointer;
      border: none;
      padding: 0;
    }
  </style>
</head>

<body>

  <!-- ポップアップ -->
  <div id="overlay">
    <div id="dialog">
      <img src="logo.png" alt="">
      <button id="ok-button" aria-label="OK"></button>
    </div>
  </div>

  <script>
    document.getElementById("ok-button").addEventListener("click", function() {
      alert("OKを押しました！");
    });
  </script>

</body>
</html>
