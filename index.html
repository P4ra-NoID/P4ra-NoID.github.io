<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眠れる子羊の館</title>  <!-- Google Fonts -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ホームページの背景 */
    #background {
      position: fixed;
      inset: 0;
      background-image: url("1000000501.webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 電光掲示板 */
    #ticker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;

      background: #111;
      overflow: hidden;
      white-space: nowrap;

      display: flex;
      align-items: center;

      z-index: 5;
    }

    /* 流れる文字 */
    #ticker-track {
      display: flex;
      width: max-content;

      animation: ticker-scroll 20s linear infinite;
    }

    #ticker-text {
      display: flex;
      flex-shrink: 0;

      font-family: "DotGothic16", sans-serif;
      font-size: 18px;
      line-height: 40px;
    }

    #ticker-text .message {
      color: cyan;
    }

    #ticker-text .separator {
      color: #777;
      margin: 0 12px;
    }

    @keyframes ticker-scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* 後ろを暗くする */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
      display: none;
    }

    /* ポップアップを画面中央に置く */
    #dialog {
      position: absolute;
      width: 375px;
      max-width: 90%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #dialog img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* OKボタンのクリック範囲 */
    #ok-button {
      position: absolute;
      left: 38.9%;
      top: 67%;
      width: 22%;
      height: 24%;

      opacity: 0;

      cursor: pointer;
      border: none;
      padding: 0;
    }

    /* ポップアップアニメーション */
    @keyframes popup-in {
      0% {
        transform: translate(-50%, -50%) scale(0);
      }

      60% {
        transform: translate(-50%, -50%) scale(1.08);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style></head><body>  <div id="background"></div>  <!-- 掲示板 -->  <div id="ticker">
    <div id="ticker-track">
      <div id="ticker-text">
        <span class="message">★このページは、スマホで見ることをおすすめします★</span>
        <span class="separator">│</span>
        <span class="message">お知らせは特にありません。現在改装工事中！乞うご期待！</span>
        <span class="separator">│</span>
      </div>
    </div>
  </div>  <div id="overlay">
    <div id="dialog">
      <img id="dialog-image" src="logo (3).png" alt="">
      <button id="ok-button" aria-label="OK"></button>
    </div>
  </div>  <script>
    const tickerText = document.getElementById("ticker-text");
    const tickerTrack = document.getElementById("ticker-track");

    // 文章を自動で複製して繋げるンゴよ
    const tickerClone = tickerText.cloneNode(true);
    tickerTrack.appendChild(tickerClone);

    const dialogImage = document.getElementById("dialog-image");
    const okButton = document.getElementById("ok-button");
    const overlay = document.getElementById("overlay");
    const dialog = document.getElementById("dialog");

    let dialogNumber = 0;

    // ページを開いて2秒後に最初のポップアップを表示
    setTimeout(function() {
      overlay.style.display = "block";

      // 出現アニメーション
      dialog.style.animation = "popup-in 0.35s ease-out";
    }, 2000);

    okButton.addEventListener("click", function() {

      if (dialogNumber === 0) {

        // 1秒後に2枚目
        dialogNumber = 1;

        setTimeout(function() {
          dialogImage.src = "logo.png";

          // 出現アニメーションをもう一度
          dialog.style.animation = "none";
          dialog.offsetHeight;
          dialog.style.animation = "popup-in 0.35s ease-out";
        }, 1000);

      } else if (dialogNumber === 1) {

        // 1秒後に3枚目
        dialogNumber = 2;

        setTimeout(function() {
          dialogImage.src = "logo (1).png";

          // 出現アニメーションをもう一度
          dialog.style.animation = "none";
          dialog.offsetHeight;
          dialog.style.animation = "popup-in 0.35s ease-out";
        }, 1000);

      } else if (dialogNumber === 2) {

        // 1秒後に4枚目
        dialogNumber = 3;

        setTimeout(function() {
          dialogImage.src = "logo (2).png";

          // 出現アニメーションをもう一度
          dialog.style.animation = "none";
          dialog.offsetHeight;
          dialog.style.animation = "popup-in 0.35s ease-out";
        }, 1000);

      } else {

        // 4枚目のOK → 最初のポップアップに戻る
        dialogNumber = 0;
        dialogImage.src = "logo (3).png";

        // 出現アニメーションをもう一度
        dialog.style.animation = "none";
        dialog.offsetHeight;
        dialog.style.animation = "popup-in 0.35s ease-out";
      }

    });
  </script></body>
</html>
