<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dream sheep</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ホームページの背景 */
    #background {
      position: fixed;
      inset: 0;
      background-image: url("https://raw.githubusercontent.com/P4ra-NoID/P4ra-NoID.github.io/refs/heads/main/ipicture-birthday-cake-10215274_1920.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 後ろを暗くする */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;

      /* 最初は非表示 */
      display: none;
    }

    /* ポップアップを画面中央に置く */
    #dialog {
      position: absolute;
      width: 375px;
      max-width: 90%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #dialog img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* OKボタンのクリック範囲 */
    #ok-button {
      position: absolute;
      left: 38.9%;
      top: 67%;
      width: 22%;
      height: 24%;

      /* クリック範囲を見えなくする */
      opacity: 0;

      cursor: pointer;
      border: none;
      padding: 0;
    }
  </style>
</head>

<body>

  <div id="background"></div>

  <div id="overlay">
    <div id="dialog">
      <img id="dialog-image" src="logo.png" alt="">
      <button id="ok-button" aria-label="OK"></button>
    </div>
  </div>

  <script>
    const dialogImage = document.getElementById("dialog-image");
    const okButton = document.getElementById("ok-button");
    const overlay = document.getElementById("overlay");

    let secondDialog = false;

    // ポップアップを見ていなければ、2秒後に表示
    if (localStorage.getItem("dreamSheepPopupSeen") !== "true") {
      setTimeout(function() {
        overlay.style.display = "block";
      }, 2000);

      <script>
  localStorage.removeItem("dreamSheepPopupSeen");
</script>
