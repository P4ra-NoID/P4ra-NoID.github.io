<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dream sheep</title>

  <style>
    body {
      margin: 0;
      background: white;
    }

    /* 後ろを暗くする */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    /* ポップアップ */
    #dialog {
      position: absolute;
      width: 375px;
      max-width: 90%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #dialog img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 透明なOKボタン */
    #ok-button {
      position: absolute;
      left: 58%;
      top: 66%;
      width: 22%;
      height: 25%;
      opacity: 0;
      cursor: pointer;
      border: none;
      padding: 0;
    }
  </style>
</head>

<body>

  <div id="overlay">
    <div id="dialog">
      <img src="logo.png" alt="">
      <button id="ok-button" aria-label="OK"></button>
    </div>
  </div>

  <script>
    document.getElementById("ok-button").addEventListener("click", function() {
      alert("OKを押しました！");
    });
  </script>

</body>
</html>
