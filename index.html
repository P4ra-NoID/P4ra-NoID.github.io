
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>俺くんの部屋</title>

  <style>
    body {
      margin: 0;
      background: white;
    }

    #dialog {
      position: relative;
      width: 375px;
      max-width: 100%;
      margin: 50px auto;
    }

    #dialog img {
      display: block;
      width: 100%;
      height: auto;
    }

    #ok-button {
      position: absolute;
      left: 68%;
      top: 66%;
      width: 22%;
      height: 25%;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="dialog">
    <img src="logo.png" alt="">
    <button id="ok-button" aria-label="OK"></button>
  </div>

</body>
</html>
